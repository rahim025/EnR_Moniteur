name: Publier le site

# À chaque modification poussée sur main, le site est republié.
# L'appli Android affiche ce site : elle se met donc à jour toute seule.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version du site
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/g" www/index.html
          echo '{"build": ${{ github.run_number }}}' > www/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
